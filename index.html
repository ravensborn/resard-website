<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESARD — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d3b66;
    --navy-deep: #071e3d;
    --navy-light: #1a5276;
    --accent: #4a9eda;
    --accent-glow: #5bb8f5;
    --white: #f0f4f8;
    --gray: #8fa3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--navy-deep);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Animated grid background */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,158,218,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,158,218,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridShift 20s linear infinite;
    z-index: 0;
  }

  @keyframes gridShift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(60px, 60px); }
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: var(--accent);
    top: -10%; left: -10%;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: var(--navy-light);
    bottom: -10%; right: -5%;
    animation-delay: -4s;
    animation-duration: 16s;
  }
  .orb-3 {
    width: 300px; height: 300px;
    background: var(--accent-glow);
    top: 50%; left: 60%;
    animation-delay: -8s;
    animation-duration: 14s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 15px) scale(0.95); }
  }

  /* Main content */
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 720px;
    animation: fadeUp 1s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-wrapper {
    margin-bottom: 3rem;
    animation: fadeUp 1s ease-out 0.2s both;
  }

  .logo-wrapper img {
    max-width: 480px;
    width: 100%;
    border-radius: 12px;
    transition: transform 0.3s;
  }
  .logo-wrapper img:hover { transform: scale(1.02); }

  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 0 auto 2.5rem;
    animation: fadeUp 1s ease-out 0.4s both;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    animation: fadeUp 1s ease-out 0.5s both;
  }

  .tagline {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    font-weight: 300;
    color: var(--gray);
    line-height: 1.8;
    margin-bottom: 3rem;
    animation: fadeUp 1s ease-out 0.6s both;
  }

  /* Pulse dot */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gray);
    animation: fadeUp 1s ease-out 0.8s both;
  }

  .pulse-dot {
    width: 8px; height: 8px;
    background: var(--accent-glow);
    border-radius: 50%;
    position: relative;
  }
  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--accent-glow);
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Contact bar */
  .contact {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    padding: 1.6rem 2rem;
    background: rgba(7,30,61,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(74,158,218,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2.5rem;
    animation: fadeUp 1s ease-out 1s both;
  }

  .contact a {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
    transition: color 0.3s, text-shadow 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .contact a svg {
    width: 16px;
    height: 16px;
    fill: var(--accent);
    flex-shrink: 0;
  }
  .contact a:hover {
    color: var(--accent-glow);
    text-shadow: 0 0 12px rgba(91,184,245,0.3);
  }

  /* Scanline effect */
  .scanline {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  @media (max-width: 600px) {
    .logo-wrapper img { max-width: 280px; }
    .contact { flex-direction: column; align-items: center; gap: 0.8rem; }
    .contact span { display: none; }
  }
</style>
</head>
